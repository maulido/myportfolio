name: Sync to Deployment Repository

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to deployment repository
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Add deployment repo as remote (public repo, no token needed)
          git remote add deploy https://github.com/maulido/myportfoliodep.git
          
          # Push to deployment repo
          git push deploy main --force
          
          echo "✅ Successfully synced to deployment repository"
