name: Sync to depportfolio (SSH Deploy Key)

on:
  push:
    branches:
      - main
      - fix/build-and-quality-issues

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout myportfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPPORTFOLIO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push to depportfolio
        run: |
          git remote add depportfolio git@github.com:maulido/depportfolio.git
          git push depportfolio ${{ github.ref_name }}:main --force
